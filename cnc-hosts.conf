# =============================================================================
# cnc-hosts.conf — Fleet host registry
# =============================================================================
# Shared config for cnc-cmd.sh and cnc-remote.sh.
# Add/remove hosts here to control what the tools can reach.
#
# Format: ROLE|HOSTNAME|AGENT_PORT|DESCRIPTION
#   ROLE:        orchestrator, agent, ollama, worker, workstation
#   HOSTNAME:    Tailscale MagicDNS hostname or IP
#   AGENT_PORT:  AgentAPI port (0 = no agent on this host)
#   DESCRIPTION: Human-readable label
#
# Lines starting with # are comments. Blank lines are ignored.
# =============================================================================

# --- Orchestrators ---
orchestrator|cnc-server|3284|CNC Server (MicroOS orchestrator)

# --- Agents / Workers ---
agent|macbook1|3284|MacBook 1 (headless agent)
agent|imac|3284|iMac (headless agent)
agent|rpi1|3284|Raspberry Pi 1
agent|rpi2|3284|Raspberry Pi 2
agent|rpi3|3284|Raspberry Pi 3

# --- Workstations ---
workstation|macbook2|3284|MacBook 2 (interactive)
workstation|windows-desktop|0|Windows Desktop
workstation|windows-laptop|0|Windows Laptop

# --- LAN Infrastructure ---
ollama|satibook|0|Satibook (primary Ollama LAN server)
ollama|kokonoe|0|Kokonoe (fallback Ollama, general purpose)
ollama|faye|0|Faye

# --- Ollama endpoints (host:port for API checks) ---
# These are checked by 'cnc-cmd.sh ollama'
# Format: OLLAMA|HOST:PORT|LABEL
ollama-endpoint|satibook:11434|Satibook (primary LAN)
ollama-endpoint|kokonoe:11434|Kokonoe (fallback LAN)
ollama-endpoint|localhost:11434|Local
